<!DOCTYPE html>
<!-- Idle cover for the music page: shown in the NP_ART slot (1100x1100) while nothing is playing, or when a track
     has no artwork. Original artwork: a record sliding out of its sleeve, with the same fades the real covers get
     (darker at the top for the header; the bottom fades out to transparent, ending where the player panel starts,
     so the panel shows below it). Rendered with a transparent background.
     build_skin.py renders it at the skin's size (it fills the window). Not a page of its own. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>ResMon - idle music cover</title>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent; }
  svg { display:block; width:100%; height:100%; }
</style>
</head>
<body>
<svg viewBox="0 0 1100 1100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgPink" cx="0.22" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#FF4FA3" stop-opacity="0.22"/><stop offset="1" stop-color="#FF4FA3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgCyan" cx="0.8" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#3DE0FF" stop-opacity="0.2"/><stop offset="1" stop-color="#3DE0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16223A"/><stop offset="1" stop-color="#0A1020"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC44D"/><stop offset="0.5" stop-color="#FF7A6B"/><stop offset="1" stop-color="#FF4FA3"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3DE0FF" stop-opacity="0"/><stop offset="0.5" stop-color="#9FF0FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3DE0FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC44D"/><stop offset="1" stop-color="#FF4FA3"/>
    </linearGradient>
    <!-- the sleeve sun's horizontal cuts -->
    <mask id="sunCuts" maskUnits="userSpaceOnUse" x="-210" y="-210" width="420" height="420">
      <rect x="-210" y="-210" width="420" height="420" fill="#fff"/>
      <rect x="-210" y="40" width="420" height="10" fill="#000"/><rect x="-210" y="66" width="420" height="13" fill="#000"/>
      <rect x="-210" y="96" width="420" height="16" fill="#000"/>
    </mask>
    <clipPath id="sleeveArt"><rect x="-210" y="-210" width="420" height="420" rx="22"/></clipPath>
    <!-- the same fades as the real covers (nowplaying.ps1): top 16 % darker; from 50 % down it fades out, gone at
         83.6 % (920 of 1100: the top of music.html's player panel) -->
    <linearGradient id="fadeOutG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset="0.25" stop-color="#fff" stop-opacity="0.84"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.5"/><stop offset="0.75" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadeOut" maskUnits="userSpaceOnUse" x="0" y="0" width="1100" height="1100">
      <rect x="0" y="0" width="1100" height="550" fill="#fff"/>
      <rect x="0" y="550" width="1100" height="370" fill="url(#fadeOutG)"/>
    </mask>
    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060B" stop-opacity="0.78"/><stop offset="1" stop-color="#04060B" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="softS" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <g mask="url(#fadeOut)">
  <rect width="1100" height="1100" fill="#04060B"/>
  <rect width="1100" height="1100" fill="url(#bgPink)"/>
  <rect width="1100" height="1100" fill="url(#bgCyan)"/>
  <!-- faint stars -->
  <g fill="#C9D4FF">
    <circle cx="90" cy="250" r="2" opacity=".5"/><circle cx="1010" cy="220" r="2.4" opacity=".6"/><circle cx="960" cy="640" r="1.8" opacity=".4"/>
    <circle cx="150" cy="700" r="1.8" opacity=".4"/><circle cx="560" cy="170" r="1.6" opacity=".4"/><circle cx="1040" cy="430" r="1.4" opacity=".4"/>
  </g>

  <!-- the record, half out of its sleeve -->
  <g transform="translate(650 470) rotate(-8)">
    <circle r="236" fill="#3DE0FF" opacity=".35" filter="url(#soft)"/>
    <circle r="230" fill="#07090F" stroke="#2A3A58" stroke-width="3"/>
    <g fill="none" stroke="#1C2840" stroke-width="2">
      <circle r="212"/><circle r="196"/><circle r="180"/><circle r="164"/><circle r="148"/><circle r="132"/><circle r="116"/><circle r="100"/>
    </g>
    <!-- light catching the grooves -->
    <path d="M-150 -150 A212 212 0 0 1 150 -150" fill="none" stroke="url(#sheen)" stroke-width="26" opacity=".7"/>
    <path d="M150 150 A212 212 0 0 1 -150 150" fill="none" stroke="url(#sheen)" stroke-width="18" opacity=".45"/>
    <circle r="78" fill="url(#label)"/>
    <circle r="60" fill="none" stroke="#04060B" stroke-opacity=".25" stroke-width="2"/>
    <circle r="9" fill="#04060B"/>
  </g>

  <!-- sleeve -->
  <g transform="translate(400 460) rotate(-8)">
    <rect x="-216" y="-216" width="432" height="432" rx="24" fill="#3DE0FF" opacity=".35" filter="url(#soft)"/>
    <rect x="-210" y="-210" width="420" height="420" rx="22" fill="url(#sleeve)" stroke="#9FF0FF" stroke-width="4"/>
    <g clip-path="url(#sleeveArt)">
      <!-- sleeve art: a striped sun over sound-wave hills -->
      <circle cx="0" cy="10" r="120" fill="url(#sunset)" mask="url(#sunCuts)"/>
      <path d="M-210 140 C-150 90 -110 170 -50 120 C10 70 50 160 110 115 C160 80 190 130 210 120 L210 210 L-210 210 Z"
            fill="#0B1222" stroke="#FF4FA3" stroke-width="4" stroke-linejoin="round"/>
      <path d="M-210 175 C-140 140 -90 200 -20 165 C40 135 90 195 150 160 C180 145 200 160 210 158"
            fill="none" stroke="#3DE0FF" stroke-width="3" stroke-opacity=".8"/>
    </g>
    <rect x="-210" y="-210" width="420" height="420" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
  </g>

  <!-- floating notes -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(895 205) rotate(10)">
      <g stroke="#FF4FA3" stroke-width="14" opacity=".5" filter="url(#softS)"><path d="M0 0 V-70 L44 -82 V-12"/></g>
      <path d="M0 0 V-70 L44 -82 V-12" stroke="#FF8CC6" stroke-width="7"/>
      <ellipse cx="-12" cy="2" rx="15" ry="11" fill="#FF8CC6" stroke="none" transform="rotate(-20 -12 2)"/>
      <ellipse cx="32" cy="-10" rx="15" ry="11" fill="#FF8CC6" stroke="none" transform="rotate(-20 32 -10)"/>
    </g>
    <g transform="translate(150 175) rotate(-12)">
      <g stroke="#3DE0FF" stroke-width="12" opacity=".5" filter="url(#softS)"><path d="M0 0 V-58 Q14 -46 26 -40"/></g>
      <path d="M0 0 V-58 Q14 -46 26 -40" stroke="#9FF0FF" stroke-width="6"/>
      <ellipse cx="-11" cy="2" rx="13" ry="9.5" fill="#9FF0FF" stroke="none" transform="rotate(-20 -11 2)"/>
    </g>
  </g>

  <!-- top fade, as on real covers -->
  <rect x="0" y="0" width="1100" height="176" fill="url(#fadeTop)"/>
  </g>
</svg>
</body>
</html>
